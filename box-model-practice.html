<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model Practice</title>
  <style>
    /* Exercise 1: one box per part of the box model */
    .content-box {
      width: 200px;
      background-color: lightgreen;
    }
    .padding-box {
      width: 200px;
      padding: 30px;
      background-color: lightblue;
    }
    .border-box {
      width: 200px;
      border: 5px solid darkgreen;
    }
    .margin-box {
      width: 200px;
      margin: 40px;
      background-color: khaki;
    }

    /* Exercise 2: fixed box, total width is 300px */
    .broken-box {
      box-sizing: border-box;
      width: 300px;
      padding: 20px;
      border: none;
      background-color: lightpink;
    }
  
    /* Exercise 3: card, 300px wide in total */
    .card {
      box-sizing: border-box;
      width: 300px;
      padding: 20px;
      border: 1px solid gray;
    }
    .card img {
      width: 100%;
      display: block;
    }
    .card h3 {
      margin-bottom: 15px;
    }
    .card button {
      margin-top: 15px;
      padding: 8px 16px;
    }
  </style>
</head>
<body>
  <h1>Box Model Practice</h1>

  <h2>Exercise 1: Box Model</h2>
  <div class="content-box">Content (background color)</div>
  <div class="padding-box">Padding (bigger area inside)</div>
  <div class="border-box">Border (visible border)</div>
  <div class="margin-box">Margin (space around the box)</div>

  <h2>Exercise 2: Fixed Layout</h2>
  <div class="broken-box">I am exactly 300px wide.</div>

  <h2>Exercise 3: Card</h2>
  <div class="card">
    <img src="https://placehold.co/260x150" alt="Card image">
    <h3>Card Title</h3>
    <p>This is the description text for my card.</p>
    <button>Read More</button>
  </div>
</body>
</html>
