<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML Conversion</title>
</head>
<body>

    <!-- Converted from <div class="header"> -->
    <header>
        <div class="logo">My Site</div>
        
        <!-- Converted from <div class="nav"> -->
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Converted from <div class="main"> -->
    <main>
        <!-- Converted from <div class="article"> -->
        <article>
            <h2>Welcome to My Site</h2>
            <p>This is my first paragraph.</p>
            <p>This is my second paragraph.</p>
        </article>

        <!-- Converted from <div class="sidebar"> -->
        <aside>
            <h3>Recent Posts</h3>
        </aside>
    </main>

    <!-- Converted from <div class="footer"> -->
    <footer>
        <p class="copyright">&copy; 2026</p>
    </footer>

</body>
</html>
