<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Daily Challenges</title>
  <style>
    body { padding: 20px; }
    section { margin-bottom: 40px; }

    /* Day 1: Button styles */
    .btn {
      padding: 10px 20px;
      border: 2px solid transparent;
      border-radius: 4px;
      font-family: var(--font-body);
      font-size: var(--font-base);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary { background: var(--color-primary); color: white; }
    .btn-primary:hover { background: var(--color-primary-dark); }

    .btn-secondary { background: transparent; color: var(--color-primary); border-color: var(--color-primary); }
    .btn-secondary:hover { background: var(--color-primary); color: white; }

    .btn-danger { background: #d32f2f; color: white; }
    .btn-danger:hover { background: #a62020; }

    .btn-disabled { background: #cccccc; color: #666666; cursor: not-allowed; }
    .btn-disabled:hover { transform: none; box-shadow: none; background: #cccccc; }
  
    /* Day 2: Card component */
    .card {
      max-width: 320px;
      border: 1px solid var(--color-muted);
      border-radius: 8px;
      overflow: hidden;
      transition: box-shadow 0.3s ease;
    }
    .card:hover { box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15); }
    .card img { display: block; width: 100%; }
    .card-body { padding: 20px; }
    .card-body h3 { margin-bottom: 10px; }
    .card-body p { margin-bottom: 15px; }
    .tags { display: flex; gap: 8px; margin-bottom: 15px; }
    .tag {
      background: var(--color-primary-light);
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: var(--font-sm);
    }
  </style>
</head>
<body>
  <h1>Daily Challenges</h1>

  <section>
    <h2>Day 1: Button Styles</h2>
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-disabled" disabled>Disabled</button>
  </section>

  <section>
    <h2>Day 2: Card Component</h2>
    <article class="card">
      <img src="https://placehold.co/320x180" alt="Card image">
      <div class="card-body">
        <h3>Card Title</h3>
        <p>A short description of what this card is about.</p>
        <div class="tags">
          <span class="tag">HTML</span>
          <span class="tag">CSS</span>
        </div>
        <button class="btn btn-primary">Learn More</button>
      </div>
    </article>
  </section>
</body>
</html>
